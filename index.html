<!-- Tab icon: the orbit's sun, one planet and its ring. It follows the browser's own theme,
     since that is what the tab bar is drawn in, not the site's light/dark toggle. -->
<link rel="icon" type="image/svg+xml" href="./icons/favicon-light.svg" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/svg+xml" href="./icons/favicon-dark.svg" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-light-32.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-dark-32.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<!-- The saved theme is applied before first paint, so a visitor who chose the opposite of their
     system setting never sees a flash of the wrong one. script.js reads the same key. -->
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
<!-- Home is deep space in either theme (src/space). Darken it before first paint so a first visit
     never flashes the pale sky; Space.tsx takes the class back off if WebGL is not there. -->
<script>if(!location.hash&&typeof WebGL2RenderingContext!=="undefined")document.documentElement.classList.add("space")</script>
